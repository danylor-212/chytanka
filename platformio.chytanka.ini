; Fork-only PlatformIO environments for «Читанка» (Chytanka), loaded from
; platformio.ini via [platformio] extra_configs. Kept out of platformio.ini so
; CrossInk rebases stay conflict-free.

; Chytanka's own release counter, independent of CrossInk's [crossink] version.
; Bump this on every Chytanka-only release (a CrossInk version bump resets the
; meaning of "0" for that base, so start back at 0 after a rebase). The OTA
; version parser in src/network/OtaUpdater.cpp reads up to 4 numeric
; dot-separated segments and stops at the first non-digit/non-dot character
; (so the trailing "-ua" is never parsed as a version segment) — see
; docs/chytanka/RELEASING.md for the full tagging rules.
[chytanka]
revision = 0

; --- «Читанка» (Chytanka) — Ukrainian edition for Xteink X3/X4 -----------------
; Daily-use build on top of CrossInk's X3/X4 release env (env:default):
; Ukrainian + English UI only. Serial log and LOG_LEVEL=1 (info) come from
; env:default. scripts/git_branch.py does not know this env, so the version
; string is set here.
;   pio run -e ua
[env:ua]
extends = env:default
custom_i18n_builtin_langs = uk
build_flags =
  ${env:default.build_flags}
  -DCROSSINK_VERSION=\"${crossink.version}.${chytanka.revision}-ua\"
  ; UI language until the settings file saves one (Language enum name, must be
  ; built in). Devices that ran stock CrossInk keep the language they saved.
  -DCHYTANKA_DEFAULT_LANGUAGE=UK
  ; Chytanka logo and name on the default boot and sleep screens
  -DCHYTANKA=1
  ; OTA installs only Chytanka releases (asset firmware-x3-x4.bin or
  ; firmware-x3-x4-<anything>.bin), never stock CrossInk or CrossPoint
  -DCROSSINK_OTA_RELEASE_URL=\"https://api.github.com/repos/danylor-212/chytanka/releases/latest\"
